<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfcff" />
    <meta name="description" content="DopeJs builds open source tools for AI-native development." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DopeJs</title>
  </head>
  <body>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('dopejs-theme'); } catch {}
        const dark = saved === 'dark' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#0b0d0a';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
